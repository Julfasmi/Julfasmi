<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 300"
     width="900"
     height="300">

  <rect width="900" height="300" fill="#0d1117"/>

  <text x="450" y="42"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="18">
    CONTRIBUTION PARTICLES
  </text>

  <g fill="#58a6ff">

    <circle cx="150" cy="130" r="5">
      <animate attributeName="cy"
               values="130;110;130"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="250" cy="190" r="4">
      <animate attributeName="cy"
               values="190;160;190"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="350" cy="100" r="6">
      <animate attributeName="cy"
               values="100;125;100"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="470" cy="175" r="5">
      <animate attributeName="cy"
               values="175;145;175"
               dur="2.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="590" cy="115" r="4">
      <animate attributeName="cy"
               values="115;140;115"
               dur="3.2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="700" cy="180" r="6">
      <animate attributeName="cy"
               values="180;150;180"
               dur="2.7s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <g stroke="#30363d" stroke-width="1">
    <line x1="150" y1="130" x2="350" y2="100"/>
    <line x1="350" y1="100" x2="590" y2="115"/>
    <line x1="250" y1="190" x2="470" y2="175"/>
    <line x1="470" y1="175" x2="700" y2="180"/>
  </g>

</svg>
